name: Build 3DS

on:
  push:
    paths: ["platform/3ds/**", "cpp/**", "generated/**", ".github/workflows/build-3ds.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure CMake support for devkitARM
        run: |
          dkp-pacman -Sy --noconfirm --needed devkitarm-cmake 3ds-cmake || true
          apt-get update && apt-get install -y --no-install-recommends cmake ninja-build

      - name: Configure
        run: >
          cmake -S platform/3ds -B build-3ds -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-3ds --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: phase-distorter-3ds
          path: build-3ds/phase-distorter-3ds.3dsx
