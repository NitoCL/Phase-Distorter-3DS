name: Build 3DS

on:
  push:
    paths:
      - "platform/3ds/**"
      - "cpp/**"
      - "generated/**"
      - ".github/workflows/build-3ds.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure CMake support and CIA tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends cmake ninja-build curl unzip python3 python3-pil ca-certificates
          curl -fsSL -o /tmp/makerom.zip "https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip"
          unzip -o /tmp/makerom.zip -d /usr/local/bin
          chmod +x /usr/local/bin/makerom
          curl -fsSL -o /tmp/bannertool.zip "https://web.archive.org/web/20201111222414if_/https://github.com/Steveice10/bannertool/releases/download/1.1.0/bannertool.zip"
          unzip -o -j /tmp/bannertool.zip linux-x86_64/bannertool -d /usr/local/bin
          chmod +x /usr/local/bin/bannertool

      - name: Configure
        run: |
          cmake -S platform/3ds -B build-3ds -G Ninja -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-3ds --parallel

      - name: Package CIA
        run: |
          python3 - << 'EOF'
          import pathlib, textwrap, wave
          from PIL import Image

          rsf = textwrap.dedent("""\
            BasicInfo:
              Title                   : "Phase Distorter 3DS"
              CompanyCode             : "00"
              ProductCode             : "CTR-P-PD3D"
              ContentType             : Application
              Logo                    : Nintendo
            TitleInfo:
              UniqueId                : 0xF8D31
              Category                : Application
            Option:
              UseOnSD                 : true
              FreeProductCode         : true
              EnableCrypt             : false
              EnableCompress          : true
            AccessControlInfo:
              FileSystemAccess:
                - DirectSdmc
            SystemControlInfo:
              SaveDataSize            : 0KB
              RemasterVersion         : 0
              StackSize               : 0x100000
          """)
          pathlib.Path("build-3ds/cia.rsf").write_text(rsf)

          with wave.open("build-3ds/silent.wav", "wb") as f:
              f.setnchannels(1)
              f.setsampwidth(2)
              f.setframerate(22050)
              f.writeframes(b"\x00\x00" * 22050)

          icon_path = pathlib.Path("platform/3ds/assets/icon.png")
          banner_img = Image.new("RGBA", (256, 128), (0, 0, 0, 0))
          if icon_path.exists():
              icon = Image.open(icon_path).convert("RGBA")
              icon.thumbnail((96, 96))
              banner_img.paste(icon, ((256 - icon.width) // 2, (128 - icon.height) // 2), icon)
              icon_48 = icon.resize((48, 48))
              icon_48.save("build-3ds/icon48.png")
          else:
              Image.new("RGBA", (48, 48), (0, 0, 0, 255)).save("build-3ds/icon48.png")
          banner_img.save("build-3ds/banner.png")
          EOF

          if [ ! -f "build-3ds/phase-distorter-3ds.smdh" ]; then
            bannertool makesmdh -s "Phase Distorter 3DS" -l "Phase Distorter 3DS" -p "NitoCL" -i build-3ds/icon48.png -o build-3ds/phase-distorter-3ds.smdh
          fi

          bannertool makebanner -i build-3ds/banner.png -a build-3ds/silent.wav -o build-3ds/banner.bnr

          ELF_FILE="build-3ds/phase-distorter-3ds.elf"
          if [ ! -f "$ELF_FILE" ]; then ELF_FILE="build-3ds/phase-distorter-3ds"; fi
          makerom -f cia -o build-3ds/phase-distorter-3ds.cia -elf "$ELF_FILE" -rsf build-3ds/cia.rsf -desc app:4 -icon build-3ds/phase-distorter-3ds.smdh -banner build-3ds/banner.bnr -DAPP_ENCRYPTED=false

      - uses: actions/upload-artifact@v4
        with:
          name: phase-distorter-3ds
          path: |
            build-3ds/phase-distorter-3ds.3dsx
            build-3ds/phase-distorter-3ds.cia
